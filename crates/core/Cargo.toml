[package]
name = "sfterm-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "SFTerm 的 SSH/SFTP 引擎：与 Tauri 解耦，可独立测试"

[dependencies]
serde = { version = "1", features = ["derive"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[[bin]]
name = "engine-check"
path = "src/bin/check.rs"
