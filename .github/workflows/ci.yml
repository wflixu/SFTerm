name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (macOS 15 · arm64)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and build frontend
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test:unit --run

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Using Rust $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.3

      - name: Rust tests (engine)
        run: cargo test --locked -p sfterm-core

      - name: Rust check (Tauri app)
        run: cargo check --locked -p app
