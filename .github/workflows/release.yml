name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS 15 · arm64 (.dmg + .app.zip)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve tag and verify version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) 与 tauri.conf.json ($VERSION) 版本不一致"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag ($TAG) 与版本号 v$VERSION 不一致"
            exit 1
          fi

      - name: Prepare signing and notarization
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # 关键：GitHub 会把未设置的 secret 变成空字符串环境变量，
          # 而 Tauri 用 var_os() 判断「变量存在」，空串也会被当成已配置。
          # 所以这里只把非空的变量写进 GITHUB_ENV，避免走错公证分支。
          export_env() {
            if [ -n "$2" ]; then
              printf '%s=%s\n' "$1" "$2" >> "$GITHUB_ENV"
            fi
          }

          if [ -n "$APPLE_CERTIFICATE" ]; then
            if [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
              echo "::error::设置了 APPLE_CERTIFICATE，但缺少 APPLE_SIGNING_IDENTITY 或 APPLE_CERTIFICATE_PASSWORD"
              exit 1
            fi
            export_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            export_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            export_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "签名：$APPLE_SIGNING_IDENTITY"
          else
            echo "::warning::未设置 APPLE_CERTIFICATE，产物不会签名，也不会公证"
          fi

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::没有签名证书，跳过公证"
          elif [ -n "$APPLE_API_KEY_P8" ]; then
            if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ]; then
              echo "::error::设置了 APPLE_API_KEY_P8，但缺少 APPLE_API_ISSUER 或 APPLE_API_KEY"
              exit 1
            fi
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            export_env APPLE_API_KEY "$APPLE_API_KEY"
            export_env APPLE_API_ISSUER "$APPLE_API_ISSUER"
            echo "公证：使用 App Store Connect API Key"
          elif [ -n "$APPLE_ID" ]; then
            if [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::APPLE_ID 需要同时提供 APPLE_PASSWORD 和 APPLE_TEAM_ID"
              exit 1
            fi
            export_env APPLE_ID "$APPLE_ID"
            export_env APPLE_PASSWORD "$APPLE_PASSWORD"
            export_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "公证：使用 Apple ID + App 专用密码"
          else
            echo "::warning::未设置公证凭据，产物只签名、不公证"
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "Using Rust $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/core -> target

      - name: Build, sign and notarize
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg --ci

      - name: Collect artifacts
        run: |
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP=$(ls -d "$BUNDLE"/macos/*.app | head -1)
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)

          mkdir -p release
          cp "$DMG" "release/SFTerm_${VERSION}_arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release/SFTerm_${VERSION}_arm64.app.zip"
          (cd release && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt)

          ls -lh release
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify code signature
        run: |
          echo "== codesign =="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || true
          codesign -dv "$APP_PATH" 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true

          echo "== Gatekeeper =="
          spctl --assess --type execute --verbose=4 "$APP_PATH" \
            || echo "::warning::spctl 未通过（多半是未签名或未公证，个人测试包可忽略）"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "SFTerm $TAG" \
              --generate-notes
          fi
